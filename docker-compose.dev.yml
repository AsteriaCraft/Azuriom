services:
    app:
        build: .
        container_name: azuriom_app
        working_dir: /var/www/azuriom
        volumes:
            - .:/var/www/azuriom
        environment:
            - DB_CONNECTION=${DB_CONNECTION}
            - DB_HOST=${DB_HOST}
            - DB_PORT=${DB_PORT}
            - DB_DATABASE=${DB_DATABASE}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
        expose:
            - "9000"
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t"]
            interval: 30s
            timeout: 10s
            retries: 3

    nginx:
        image: nginx:latest
        container_name: azuriom_nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/azuriom
            - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
