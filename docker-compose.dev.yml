# Azuriom Docker Compose Configuration
# Використовує змінні з .env.docker файлу
version: '3.8'

services:
  # PHP-FPM сервіс для Azuriom
  app:
    build: .
    container_name: azuriom_app
    working_dir: /var/www/azuriom
    volumes:
      - .:/var/www/azuriom
      - vendor_data:/var/www/azuriom/vendor  # Зберігаємо vendor окремо
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-azuriom}
      - DB_USERNAME=${DB_USERNAME:-azuriom}
      - DB_PASSWORD=${DB_PASSWORD:-secure_password_123}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx веб-сервер
  nginx:
    image: nginx:alpine
    container_name: azuriom_nginx
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - .:/var/www/azuriom
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # MySQL база даних
  mysql:
    image: mysql:8.0
    container_name: azuriom_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_123}
      MYSQL_DATABASE: ${DB_DATABASE:-azuriom}
      MYSQL_USER: ${DB_USERNAME:-azuriom}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secure_password_123}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql.cnf:/etc/mysql/conf.d/azuriom.cnf:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-azuriom}", "-p${DB_PASSWORD:-secure_password_123}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # phpMyAdmin для управління базою (опціонально)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: azuriom_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-azuriom}
      PMA_PASSWORD: ${DB_PASSWORD:-secure_password_123}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  vendor_data:
    driver: local

networks:
  default:
    name: azuriom_network
