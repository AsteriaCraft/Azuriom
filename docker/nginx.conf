# Nginx конфігурація для Azuriom згідно з офіційним гайдом
server {
    listen 80;
    server_name _;
    
    # ВАЖЛИВО: root повинен вказувати на /public директорію
    root /var/www/azuriom/public;

    # Безпекові заголовки як рекомендує Azuriom
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    index index.html index.htm index.php;
    charset utf-8;

    # Основне правило маршрутизації для Laravel/Azuriom
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Оптимізація для статичних файлів
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location = /robots.txt { 
        access_log off; 
        log_not_found off; 
    }

    # Обробка PHP файлів через PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Підключення до PHP-FPM контейнера
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        
        # Використовуємо $realpath_root як рекомендує Azuriom
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        include fastcgi_params;
        
        # Додаткові параметри для стабільності
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Заборона доступу до прихованих файлів (крім .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Обробка помилок
    error_page 404 /index.php;

    # Логування
    access_log /var/log/nginx/azuriom_access.log;
    error_log /var/log/nginx/azuriom_error.log;
    
    # Збільшення максимального розміру завантаження
    client_max_body_size 100M;
}
